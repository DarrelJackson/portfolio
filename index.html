    <script>
      (function () {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Darrel Jackson | Full Stack Software Engineer</title>
    <meta name="description" content="Full-stack software engineer with four years of experience building web applications and internal tools." />
